$schema: 'https://raw.githubusercontent.com/context-hub/generator/refs/heads/main/json-schema.json'
import:
  - type: url
    url: https://gist.githubusercontent.com/butschster/1b7e597691cc1a6476b15dc120ecbddb/raw/8c0f9d0145dcd260b814f866ec130ec630c80ee8/prompts.yaml

documents:
  -
    description: 'Src contracts and base Forker class structure overview'
    outputPath: src-contracts-structure.md
    overwrite: true
    sources:
      -
        type: file
        sourcePaths:
          - src/Contracts
          - src/Forker.php
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true

  - description: 'Src exceptions structure overview'
    outputPath: src-exceptions-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - src/Exceptions
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true

  - description: 'Src helpers structure overview'
    outputPath: src-helpers-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - src/Helpers
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true

  - description: 'Src process implements structure overview'
    outputPath: src-process-implements-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - src/Process
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true

  - description: 'Src process manager implements structure overview'
    outputPath: src-process-manager-implements-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - src/ProcessManager
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true


  - description: 'Src storge implements structure overview'
    outputPath: src-storge-implements-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - src/Storage
          - src/Traits
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true

  - description: 'Test structure overview'
    outputPath: test-structure.md
    overwrite: true
    sources:
      - type: file
        sourcePaths:
          - tests
        renderFormat: ascii
        enabled: true
        showCharCount: true
        showSize: true